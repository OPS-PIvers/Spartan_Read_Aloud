name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The suites have no dependencies - they load the Apps Script sources
      # into a Node VM with stubs - so there is nothing to install.
      - name: Run test suites
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test files found under tests/" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
