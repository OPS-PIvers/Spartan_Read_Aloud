<div id="assessment-selection-container" style="display: none;">
    <h2>Select Your Assessment</h2>
    <p class="selection-subtitle">Choose which assessment you'd like to take</p>
    <div id="assessment-grid" class="assessment-grid">
      <!-- Assessment cards will be inserted here dynamically -->
    </div>
    <button class="back-to-login-btn" onclick="backToLogin()">Back to Login</button>
</div>

<div id="viewer-container" style="display: none;">
    <div id="pdf-container">
      <!-- Canvases will be added here -->
    </div>
</div>

<div id="audio-toolbar" style="display: none;">
    <div class="audio-toolbar-inner">
      <!-- Left Zone: Title -->
      <div class="toolbar-title">
        <p id="current-title-text" class="toolbar-title-main">Loading...</p>
        <p id="chunk-counter" class="toolbar-title-sub">Chunk 1 of 1</p>
      </div>

      <!-- Center Zone: Playback Controls -->
      <div class="toolbar-controls">
        <button id="skip-back-btn" class="control-btn control-skip" title="Skip back 10 seconds" aria-label="Skip back 10 seconds">
          <span class="material-icons">replay_10</span>
        </button>
        <button id="prev-btn" class="control-btn control-prev" title="Previous chunk" aria-label="Previous chunk">
          <span class="material-icons">skip_previous</span>
        </button>
        <button id="play-pause-btn" class="control-btn control-play" title="Play/Pause" aria-label="Play or pause">
          <span class="material-icons play-icon">play_arrow</span>
          <span class="material-icons pause-icon" style="display: none;">pause</span>
          <span class="material-icons loading-spinner" style="display: none;">refresh</span>
        </button>
        <button id="next-btn" class="control-btn control-next" title="Next chunk" aria-label="Next chunk">
          <span class="material-icons">skip_next</span>
        </button>
        <button id="skip-forward-btn" class="control-btn control-skip" title="Skip forward 10 seconds" aria-label="Skip forward 10 seconds">
          <span class="material-icons">forward_10</span>
        </button>
      </div>

      <!-- Right Zone: Progress Bar + Actions -->
      <div class="toolbar-right">
        <div class="progress-compact">
          <div class="progress-bar-container">
            <div id="progress-bar-bg" class="progress-bar-bg">
              <div id="progress-bar-fill" class="progress-bar-fill"></div>
              <div id="chunk-markers" class="chunk-markers"></div>
            </div>
            <input type="range" id="timeline" class="timeline-slider" min="0" max="100" value="0"
                   title="Audio timeline" aria-label="Audio timeline slider">
          </div>
          <div class="time-displays">
            <span id="current-time" class="time-display">01:02</span>
            <span class="time-separator">/</span>
            <span id="total-time" class="time-display">-01:34</span>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="speed-menu-btn" class="control-btn" title="Playback speed" aria-label="Playback speed">
            <span id="speed-display" class="text-sm font-bold" style="font-size: 11px;">1.0x</span>
          </button>
        </div>
      </div>

      <!-- Speed Menu Popup (Hidden by default) -->
      <div id="speed-popup" class="popup-menu" style="display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 12px; background: white; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #E5E7EB; padding: 16px; min-width: 200px; z-index: 100;">
        <p style="text-align: center; font-size: 14px; font-weight: 500; color: #1F2937; margin-bottom: 12px;">Playback Speed</p>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <button class="speed-preset" data-speed="0.5" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; background: transparent; border: none; color: #6B7280; cursor: pointer; transition: all 0.2s;">0.5x</button>
          <button class="speed-preset" data-speed="0.75" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; background: transparent; border: none; color: #6B7280; cursor: pointer; transition: all 0.2s;">0.75x</button>
          <button class="speed-preset" data-speed="1.0" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; background: transparent; border: none; color: #6B7280; cursor: pointer; transition: all 0.2s;">1.0x</button>
          <button class="speed-preset active" data-speed="1.25" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; background: #4F46E5; border: none; color: white; cursor: pointer; transition: all 0.2s;">1.25x</button>
          <button class="speed-preset" data-speed="1.5" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; background: transparent; border: none; color: #6B7280; cursor: pointer; transition: all 0.2s;">1.5x</button>
          <button class="speed-preset" data-speed="2.0" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; background: transparent; border: none; color: #6B7280; cursor: pointer; transition: all 0.2s;">2.0x</button>
        </div>
      </div>

      <!-- Chunk Menu Popup (Hidden by default) - Appears above title when clicked -->
      <div id="chunk-popup" class="popup-menu" style="display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 12px; background: white; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #E5E7EB; padding: 16px; min-width: 300px; max-width: 400px; max-height: 256px; overflow-y: auto; z-index: 100;">
        <p style="text-align: center; font-size: 14px; font-weight: 500; color: #1F2937; margin-bottom: 12px;">Questions</p>
        <div id="title-dropdown" style="display: flex; flex-direction: column; gap: 8px;">
          <!-- Will be populated with chunks -->
        </div>
      </div>

      <!-- Hidden elements for compatibility -->
      <div id="toolbar-secondary" style="display: none;"></div>
      <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.25" value="1.0" style="display: none;" aria-label="Fine-tune playback speed">
      <button id="toggle-secondary-btn" style="display: none;"></button>
      <button id="focus-mode-btn" style="display: none;"></button>
      <button id="loop-btn" style="display: none;"></button>
      <div id="keyboard-hints" style="display: none;"></div>
    </div>
</div>
